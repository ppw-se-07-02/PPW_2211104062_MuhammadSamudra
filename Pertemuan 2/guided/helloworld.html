        /* Box Model */
        div {
            width: 300px;
            /* lebar */
            height: 150px;
            /* tinggi */
            margin: 20px;
            /* jarak luar */
            padding: 15px;
            /* jarak dalam */
            border: 2px solid black;
            /* garis tepi */
            border-radius: 8px;
            /* sudut melengkung */
        }

        /* Layout */
        nav ul li {
            display: inline-block;
            /* menu sejajar */
            margin-right: 15px;
            /* jarak antar menu */
        }

        /* Efek Hover */
        a {
            color: blue;
            text-decoration: none;
            /* hilangkan garis bawah */
        }

            color: red;
            /* berubah saat diarahkan */
        }
