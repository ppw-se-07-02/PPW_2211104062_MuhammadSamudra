<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda - SamudShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="bg-light border-bottom mb-3">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <div class="logo d-flex align-items-center">
        <img src="assets/img/logo.png" alt="Logo" class="me-2" height="40">
        <span class="fw-bold">SamudShop</span>
      </div>
      <nav>
        <a href="index.html" class="me-3 text-decoration-none text-dark">Beranda</a>
        <a href="#produk" class="me-3 text-decoration-none text-dark">Produk</a>
        <a href="#" class="text-decoration-none text-dark">Login</a>
      </nav>
    </div>
  </header>

  <!-- CAROUSEL -->
  <div id="carouselExample" class="carousel slide mb-4"
       data-bs-ride="carousel" data-bs-interval="3000" data-bs-pause="false">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="assets/img/produk1.jpg" class="d-block w-100" height="300" style="object-fit:cover;">
      </div>
      <div class="carousel-item">
        <img src="assets/img/produk2.jpg" class="d-block w-100" height="300" style="object-fit:cover;">
      </div>
      <div class="carousel-item">
        <img src="assets/img/produk3.jpg" class="d-block w-100" height="300" style="object-fit:cover;">
      </div>
    </div>
    <!-- Tombol navigasi kecil -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- KONTEN -->
  <div class="container">
    <div class="row">
      <!-- KOLOM REKOMENDASI -->
      <aside class="col-md-3 mb-4">
        <h5>Rekomendasi</h5>
        <ul class="list-group">
          <li class="list-group-item">Produk Populer</li>
          <li class="list-group-item">Promo Minggu Ini</li>
          <li class="list-group-item">Terlaris</li>
        </ul>
      </aside>

      <!-- KOLOM KANAN: PENCARIAN + PRODUK -->
      <main class="col-md-9">
        <!-- Pencarian -->
        <div class="mb-3">
          <input type="text" id="search" class="form-control" placeholder="Cari produk...">
        </div>

        <!-- Daftar Produk -->
        <div class="row" id="product-list">
          <div class="col-md-4 mb-4 product-card" data-name="Produk 1">
            <div class="card h-100 text-center">
              <img src="assets/img/produk1.jpg" class="card-img-top" alt="Produk 1">
              <div class="card-body">
                <h5 class="card-title">Gantungan Kunci</h5>
                <p class="card-text">Rp100.000</p>
                <a href="detail.html?product=1" class="btn btn-primary">Detail</a>
              </div>
            </div>
          </div>

          <div class="col-md-4 mb-4 product-card" data-name="Produk 2">
            <div class="card h-100 text-center">
              <img src="assets/img/produk2.jpg" class="card-img-top" alt="Produk 2">
              <div class="card-body">
                <h5 class="card-title">Mouse</h5>
                <p class="card-text">Rp150.000</p>
                <a href="detail.html?product=2" class="btn btn-primary">Detail</a>
              </div>
            </div>
          </div>

          <div class="col-md-4 mb-4 product-card" data-name="Produk 3">
            <div class="card h-100 text-center">
              <img src="assets/img/produk3.jpg" class="card-img-top" alt="Produk 3">
              <div class="card-body">
                <h5 class="card-title">Headphone</h5>
                <p class="card-text">Rp200.000</p>
                <a href="detail.html?product=3" class="btn btn-primary">Detail</a>
              </div>
            </div>
          </div>

          <div class="col-md-4 mb-4 product-card" data-name="Produk 4">
            <div class="card h-100 text-center">
              <img src="assets/img/produk4.jpg" class="card-img-top" alt="Produk 4">
              <div class="card-body">
                <h5 class="card-title">Kursi</h5>
                <p class="card-text">Rp250.000</p>
                <a href="detail.html?product=4" class="btn btn-primary">Detail</a>
              </div>
            </div>
          </div>

          <div class="col-md-4 mb-4 product-card" data-name="Produk 5">
            <div class="card h-100 text-center">
              <img src="assets/img/produk5.jpg" class="card-img-top" alt="Produk 5">
              <div class="card-body">
                <h5 class="card-title">Kalung</h5>
                <p class="card-text">Rp300.000</p>
                <a href="detail.html?product=5" class="btn btn-primary">Detail</a>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-light text-center py-3 mt-4 border-top">
    SamudShop + by 2211104062
  </footer>

  <!-- SCRIPT -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Fitur pencarian produk (dipindahkan dari script.js)
    $(document).ready(function() {
      $("#search").on("keyup", function() {
        const val = $(this).val().toLowerCase();
        $(".product-card").filter(function() {
          $(this).toggle($(this).data("name").toLowerCase().indexOf(val) > -1);
        });
      });
    });
  </script>
</body>
</html>
