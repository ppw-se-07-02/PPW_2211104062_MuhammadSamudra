<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Halaman Administrator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
    }
    header, footer {
      background: #ccc;
      padding: 10px;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 5px;
      padding: 10px;
    }
    .menu {
      border: 1px solid #000;
      text-align: left;
      padding: 10px;
    }
    .menu p {
      margin: 5px 0;
    }
    .main {
      border: 1px solid #000;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h2>Header</h2>
  </header>

  <div class="content">
    <div class="menu">
      <strong>Menu:</strong><br>
      <p>Data User</p>
      <p>Kelola Produk</p>
      <p>Edit Password</p>
      <p>Logout</p>
    </div>

    <div class="main">
      Konten Dinamis
    </div>
  </div>

  <footer>
    <p>Footer</p>
  </footer>
</body>
</html>
