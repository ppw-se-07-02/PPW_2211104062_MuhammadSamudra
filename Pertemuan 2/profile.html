<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Halaman Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
    }
    header, footer {
      background: #ccc;
      padding: 10px;
    }
    nav {
      background: #eee;
      padding: 8px;
    }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: black;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 5px;
      padding: 10px;
    }
    .box {
      border: 1px solid #000;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h2>Header</h2>
  </header>

  <nav>
    <a href="#">Beranda</a>
    <a href="#">Produk</a>
    <a href="#">Member</a>
    <a href="#">Login</a>
  </nav>

  <div class="container">
    <div class="box">Populer</div>
    <div class="box">Konten Dinamis</div>
    <div class="box">Iklan</div>
  </div>

  <footer>
    <p>Footer</p>
  </footer>
</body>
</html>
