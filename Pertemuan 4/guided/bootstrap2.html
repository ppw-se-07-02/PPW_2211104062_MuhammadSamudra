<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Tabel Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .table-container {
            margin-top: 50px;
        }
        img {
            width: 40%;
            margin: 10px;
        }
    </style>
</head>
<body>

    <div class="container table-container">
        <h2 class="mb-4">Daftar Penduduk - Tabel Hover Style</h2>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nama Lengkap</th>
                        <th scope="col">Asal Kota</th>
                        <th scope="col">Umur</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">1</th>
                        <td>Budi Rojadi</td>
                        <td>Semarang</td>
                        <td>35 th</td>
                    </tr>
                    <tr>
                        <th scope="row">2</th>
                        <td>Yulia Santi</td>
                        <td>Bekasi</td>
                        <td>32</td>
                    </tr>
                    <tr>
                        <th scope="row">3</th>
                        <td>Fahri Abdilah</td>
                        <td>Medan</td>
                        <td>38 th</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <hr>

    <div class="container">
        <h2>Thumbnail & Fluid</h2>
        <img src="reisa.jpg" class="img-thumbnail" alt="Cinque Terre" >
        <img src="reisa.jpg" class="img-fluid" alt="Responsive image">
    </div>

    <hr>
    <div class="container">
        <h4>Button Styles</h4>
        <button type="button" class="btn btn-secondary">Secondary</button>
        <button type="button" class="btn btn-primary btn-lg">Primary</button>
        <button type="button" class="btn btn-success w-100">Success</button>
        <button type="button" class="btn btn-info btn-sm">Info</button>
        <button type="button" class="btn btn-warning">Warning</button>
        <button type="button" class="btn btn-danger">Danger</button>
        <button type="button" class="btn btn-link">Link</button>
    </div>

    <hr>
    <div class="container mt-5">
        <h3>Horizontal form</h3>
        <form action="/action_page.php">
            <div class="row mb-3">
                <label for="uname" class="col-sm-2 col-form-label">Username:</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="uname" placeholder="Enter username" name="uname">
                </div>
            </div>

            <div class="row mb-3">
                <label for="pwd" class="col-sm-2 col-form-label">Password:</label>
                <div class="col-sm-10">
                    <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pwd">
                </div>
            </div>

            <div class="row">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-success">Submit</button>
                </div>
            </div>
        </form>
    </div>

    <div class="container mt-5">
        <h3>Vertical Form</h3>
        <p class="text-muted">Label berada di atas input.</p>
        
        <form action="/action_page.php">
            <div class="mb-3">
                <label for="v-uname" class="form-label">Username:</label>
                <input type="text" class="form-control" id="v-uname" placeholder="Enter username" name="uname">
            </div>

            <div class="mb-3">
                <label for="v-pwd" class="form-label">Password:</label>
                <input type="password" class="form-control" id="v-pwd" placeholder="Enter password" name="pwd">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">Ingat saya</label>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
